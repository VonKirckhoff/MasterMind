<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastermind</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
            background-color: black;
        }
        #game {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            max-width: 300px; 
        }
        #score {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        #score {
            align-items: center;
        }
        #score span {
            font-weight: bold;
        }
        #resetRecord {
            padding: 3px 8px;
            font-size: 0.8em;
            background-color: #fff;
            color: #c00;
            border: 1px solid #c00;
            border-radius: 4px;
            cursor: pointer;
        }
        #colors {
            margin-bottom: 20px;
            text-align: center;
        }
        .color {
            width: 25px;
            height: 25px;
            margin: 3px;
            display: inline-block;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ddd;
        }
        #board {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            opacity: 0.45;           /* Toekomstige rijen zijn gedimd */
        }
        .row.active,
        .row.done {
            opacity: 1;
        }
        .hole {
            width: 20px;
            height: 20px;
            margin: 3px;
            border-radius: 50%;
            border: 2px solid #ddd;
        }
        .row.active .hole {
            cursor: pointer;
        }
        /* Geselecteerd gat: hier komt de volgende kleur terecht */
        .hole.selected {
            border-color: #333;
            box-shadow: 0 0 0 2px #28a745;
        }
        .feedback {
            margin-left: 10px;
            display: grid; 
            grid-template-columns: repeat(2, 12px);
            grid-template-rows: repeat(2, 12px);
            gap: 2px;
        }
        .feedback .pin {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #333;
            background-color: #ccc;
        }
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .buttons button {
            padding: 10px 20px;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #check {
            background-color: #28a745;
        }
        #newGame {
            background-color: #007bff;
            display: none;
        }
        #check:disabled {
            background-color: #999;
            cursor: default;
        }
        #message {
            margin-top: 20px;
            font-size: 1.2em;
            text-align: center;
        }
        #solution {
            display: none;
            justify-content: center;
            margin-top: 8px;
        }
        #hint {
            font-size: 0.7em;
            color: #555;
            text-align: center;
            margin-bottom: 10px;
        }
        #legend {
            background-color: #fff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            max-width: 300px;
            text-align: center;
        }
        #legend .legend-item {
            display: flex;
            align-items: center;
            justify-content: left;
            margin: 5px 0;
        }
        #legend .legend-item .legend-color {
            width: 12px;
            height: 12px;
            margin-right: 10px;
            border-radius: 50%;
            border: 1px solid #333;
        }
        #legend .legend-item .legend-text {
            font-size: 0.7em;
        }
        .turn-number {
            margin-right: 10px;
            font-weight: bold;
            width: 70px;
        }
    </style>
</head>
<body>

<div id="game">
    <div id="score">
        <div>Reeks: <span id="streak">0</span></div>
        <div>Record: <span id="record">0</span></div>
        <button id="resetRecord" title="Record terugzetten naar 0">Reset</button>
    </div>

    <div id="colors">
        <div class="color" data-color="red" style="background-color: red;"></div>
        <div class="color" data-color="blue" style="background-color: blue;"></div>
        <div class="color" data-color="green" style="background-color: green;"></div>
        <div class="color" data-color="yellow" style="background-color: yellow;"></div>
        <div class="color" data-color="orange" style="background-color: orange;"></div>
        <div class="color" data-color="purple" style="background-color: purple;"></div>
    </div>

    <div id="hint">Klik op een gat om het te selecteren en kies dan een kleur. Klik nog eens op een geselecteerd gat om het leeg te maken.</div>

    <div id="board">
        <!-- De 10 rijen worden hier aangemaakt -->
    </div>

    <div class="buttons">
        <button id="check">Controleer</button>
        <button id="newGame">Volgend spel</button>
    </div>
    <div id="message"></div>
    <div id="solution"></div>

    <div id="legend">
        <div class="legend-item">
            <div class="legend-color" style="background-color: black;"></div>
            <div class="legend-text">Zwarte peg: Juiste kleur en positie</div>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background-color: white; border: 1px solid #333;"></div>
            <div class="legend-text">Witte peg: Juiste kleur, verkeerde positie</div>
        </div>
    </div>
</div>

<script>
    const MAX_TURNS = 10;
    const colorOptions = ['red', 'blue', 'green', 'yellow', 'orange', 'purple'];

    const colors = document.querySelectorAll('.color');
    const board = document.getElementById('board');
    const checkButton = document.getElementById('check');
    const newGameButton = document.getElementById('newGame');
    const message = document.getElementById('message');
    const solution = document.getElementById('solution');
    const streakEl = document.getElementById('streak');
    const recordEl = document.getElementById('record');

    let guess;
    let secretCode;
    let rows = [];           // Alle 10 rijen
    let currentRow = null;
    let turn;                // 1 t.e.m. 10
    let selectedPos;
    let gameOver;

    const RECORD_KEY = 'mastermind-record';
    const resetRecordButton = document.getElementById('resetRecord');

    let streak = 0;          // Aantal gewonnen spellen na elkaar
    let record = loadRecord(); // Langste reeks ooit, bewaard in de browser

    // Lees het record uit localStorage (0 als er nog niets bewaard is)
    function loadRecord() {
        try {
            const saved = parseInt(localStorage.getItem(RECORD_KEY), 10);
            return isNaN(saved) ? 0 : saved;
        } catch (e) {
            return 0; // localStorage niet beschikbaar
        }
    }

    // Schrijf het record weg naar localStorage
    function saveRecord() {
        try {
            localStorage.setItem(RECORD_KEY, record);
        } catch (e) {
            console.warn('Record kon niet bewaard worden:', e);
        }
    }

    function generateSecretCode() {
        secretCode = [];
        for (let i = 0; i < 4; i++) {
            secretCode.push(colorOptions[Math.floor(Math.random() * colorOptions.length)]);
        }
        console.log(secretCode);
    }

    // Toon welk gat geselecteerd is; enkel in de actieve rij
    function updateSelection() {
        board.querySelectorAll('.hole.selected').forEach(h => h.classList.remove('selected'));
        if (!gameOver && currentRow) {
            currentRow.querySelectorAll('.hole')[selectedPos].classList.add('selected');
        }
    }

    function nextEmptyPos(from) {
        for (let i = 1; i <= 4; i++) {
            const pos = (from + i) % 4;
            if (guess[pos] === "") return pos;
        }
        return from;
    }

    // Maak één rij aan (nog niet actief)
    function createRow(number) {
        const row = document.createElement('div');
        row.classList.add('row');

        const turnLabel = document.createElement('div');
        turnLabel.classList.add('turn-number');
        turnLabel.textContent = `Beurt ${number}:`;
        row.appendChild(turnLabel);

        for (let i = 0; i < 4; i++) {
            const hole = document.createElement('div');
            hole.classList.add('hole');
            hole.setAttribute('data-pos', i);

            hole.addEventListener('click', function() {
                if (row !== currentRow || gameOver) return; // Enkel de actieve rij is bewerkbaar

                if (selectedPos === i && guess[i] !== "") {
                    guess[i] = "";
                    hole.style.backgroundColor = "";
                } else {
                    selectedPos = i;
                }
                message.textContent = "";
                updateSelection();
            });

            row.appendChild(hole);
        }

        const feedback = document.createElement('div');
        feedback.classList.add('feedback');
        for (let i = 0; i < 4; i++) {
            const pin = document.createElement('div');
            pin.classList.add('pin');
            feedback.appendChild(pin);
        }
        row.appendChild(feedback);

        board.appendChild(row);
        return row;
    }

    // Maak de volgende rij actief
    function activateRow(number) {
        if (currentRow) {
            currentRow.classList.remove('active');
            currentRow.classList.add('done');
        }
        currentRow = rows[number - 1];
        currentRow.classList.add('active');
        guess = ["", "", "", ""];
        selectedPos = 0;
        updateSelection();
    }

    function updateScore() {
        streakEl.textContent = streak;
        recordEl.textContent = record;
    }

    function showSolution() {
        solution.innerHTML = "";
        secretCode.forEach(color => {
            const hole = document.createElement('div');
            hole.classList.add('hole');
            hole.style.backgroundColor = color;
            solution.appendChild(hole);
        });
        solution.style.display = 'flex';
    }

    function endGame(won) {
        gameOver = true;
        currentRow.classList.remove('active');
        currentRow.classList.add('done');
        updateSelection();                 // Verwijdert de groene rand
        checkButton.disabled = true;
        newGameButton.style.display = 'inline-block';

        if (won) {
            streak++;
            if (streak > record) {
                record = streak;
                saveRecord();
                message.textContent = `Gewonnen in ${turn} beurten! Nieuw record: ${record}!`;
            } else {
                message.textContent = `Gewonnen in ${turn} beurten!`;
            }
        } else {
            streak = 0;
            message.textContent = "Helaas, de 10 beurten zijn op. De oplossing was:";
            showSolution();
        }
        updateScore();
    }

    function startGame() {
        board.innerHTML = "";
        rows = [];
        currentRow = null;
        gameOver = false;
        turn = 1;
        message.textContent = "";
        solution.style.display = 'none';
        checkButton.disabled = false;
        newGameButton.style.display = 'none';

        generateSecretCode();
        for (let i = 1; i <= MAX_TURNS; i++) {
            rows.push(createRow(i));
        }
        activateRow(1);
    }

    colors.forEach(color => {
        color.addEventListener('click', function() {
            if (gameOver) return;

            const selectedColor = this.getAttribute('data-color');
            const hole = currentRow.querySelectorAll('.hole')[selectedPos];
            hole.style.backgroundColor = selectedColor;
            guess[selectedPos] = selectedColor;

            selectedPos = nextEmptyPos(selectedPos);
            message.textContent = "";
            updateSelection();
        });
    });

    checkButton.addEventListener('click', function() {
        if (gameOver) return;
        if (guess.includes("")) {
            message.textContent = "Vul alle gaten in!";
            return;
        }

        let correctPosition = 0;
        let correctColor = 0;
        let secretCodeCopy = [...secretCode];

        guess.forEach((color, index) => {
            if (color === secretCode[index]) {
                correctPosition++;
                secretCodeCopy[index] = null;
            }
        });

        guess.forEach((color, index) => {
            if (color !== secretCode[index] && secretCodeCopy.includes(color)) {
                correctColor++;
                secretCodeCopy[secretCodeCopy.indexOf(color)] = null;
            }
        });

        const pins = currentRow.querySelectorAll('.pin');
        for (let i = 0; i < correctPosition; i++) {
            pins[i].style.backgroundColor = 'black';
        }
        for (let i = correctPosition; i < correctPosition + correctColor; i++) {
            pins[i].style.backgroundColor = 'white';
        }

        if (correctPosition === 4) {
            endGame(true);
        } else if (turn === MAX_TURNS) {
            endGame(false);
        } else {
            turn++;
            activateRow(turn);
        }
    });

    newGameButton.addEventListener('click', startGame);

    // Record resetten (na bevestiging); de huidige reeks begint ook opnieuw
    resetRecordButton.addEventListener('click', function() {
        if (!confirm('Weet je zeker dat je het record wilt resetten?')) return;
        record = 0;
        streak = 0;
        try {
            localStorage.removeItem(RECORD_KEY);
        } catch (e) {
            console.warn('Record kon niet verwijderd worden:', e);
        }
        updateScore();
    });

    updateScore();
    startGame();
</script>

</body>
</html>
